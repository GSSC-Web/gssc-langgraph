[project]
name = "gssc-langgraph"
version = "0.1.0"
description = "GSSC LangGraph Agent Server (Python)"
readme = "README.md"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3",
    "langgraph-sdk>=0.1",
    "langgraph-checkpoint-sqlite>=2",
    "langgraph-checkpoint-postgres>=2",
    "langchain-xai>=0.2",
    "langchain-core>=0.3",
    "psycopg[binary]>=3.2",
]

[project.scripts]
gssc-langgraph = "gssc_langgraph:main"
closeout = "gssc_langgraph.closeout.cli:main"
software = "gssc_langgraph.software.cli:main"
test-dev = "gssc_langgraph.test_dev.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
